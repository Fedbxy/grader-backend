name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    # The production host is arm64, and images built on ubuntu-latest are
    # amd64-only: the host could never pull them ("no matching manifest for
    # linux/arm64/v8"), so deploys silently ran images built on the host.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-to-host:
    name: Deploy to Remote Host
    runs-on: ubuntu-latest
    needs: build-and-push-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Deploy to Host
        uses: and-fm/cloudflared-ssh-action@v3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          private_key_filename: ${{ secrets.SSH_PRIVATE_KEY_FILENAME }}
          private_key_value: ${{ secrets.SSH_PRIVATE_KEY_VALUE }}
          port: ${{ secrets.SSH_PORT }}
          service_token_id: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_ID }}
          service_token_secret: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_SECRET }}
          commands: |
            cd ~/Desktop/grader-backend
            git fetch origin main
            git reset --hard origin/main

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull || { echo "pull failed; not deploying"; exit 1; }
            docker compose up -d --force-recreate
            docker image prune -f

            # Fail the deploy if the judge does not come up. Only fixed status
            # text is printed — the worker's own log can contain connection
            # details, and these logs are public.
            for i in $(seq 1 30); do
              docker logs grader-backend 2>&1 | grep -q "up with" && break
              sleep 2
            done
            docker logs grader-backend 2>&1 | grep -oE "up with [0-9]+ lane\(s\)|missing configuration: [A-Z0-9_, ]+" | tail -1
            docker logs grader-backend 2>&1 | grep -q "up with" || { echo "judge did not come up; on the host run: docker logs grader-backend"; exit 1; }
