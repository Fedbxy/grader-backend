services:
  backend:
    image: ${REGISTRY}/${IMAGE_NAME}:main
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grader-backend
    privileged: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - S3_ENDPOINT=minio-storage
      - S3_PORT=9001
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - LANES=${LANES:-1}
    volumes:
      - backend-data:/app/testcases
    networks:
      - grader_grader-network
    restart: unless-stopped

volumes:
  backend-data:

networks:
  grader_grader-network:
    external: true
